name: Build and deploy appt
on:
    push:
        branches:
            - dev
jobs:
    build-deploy:
        runs-on: ubuntu-latest
        steps:
          - name: checkout code 
            uses: actions/checkout@v3
          - name: login to dockerhub
            run: |
                  echo "${{ secrets.DOCKERHUB_PASSWORD }}" | docker login --username "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
          - name: build and push docker image
            run: |
                  BRANCH_NAME=${{ github.ref_name }}
                  docker build -t foodecom -f Dockerfile-dev .
                  docker tag foodecom:latest ${{ secrets.DOCKERHUB_USERNAME }}/foodecom:$BRANCH_NAME
                  docker push ${{ secrets.DOCKERHUB_USERNAME }}/foodecom:$BRANCH_NAME
          - name: deploy using ssh again
            uses: appleboy/ssh-action@v0.1.6
            with:
              host: ${{ secrets.SERVER_IP }}
              username: ubuntu
              key: ${{ secrets.SSH_KEY }}
              #options: ['-o StrictHostKeyChecking=no']
              script: |
                        cd /home/ubuntu/foodecom 
                        docker-compose up -d


